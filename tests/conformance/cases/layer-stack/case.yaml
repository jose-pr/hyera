description: >-
  The global/environment/module provider stack (lookup_adapter.rb's
  PROVIDER_STACK), discovery, per-layer config versions, hiera3_backend's
  global-only rule, cross-layer lookup_options, and the module
  default_hierarchy fallback -- one production environment with its own
  modules plus a basemodulepath.
queries:
  - key: g_only
  - key: g_env
  - key: g_ref_env
  - key: env_only
  - key: env_ref_mod
  - key: shared_lo
  - key: mymod::lo_both
  - key: mymod::only_mod
  - key: mymod::mn
  - key: mymod::ref_env
  - key: basemod::k
  - key: dhbad::main
  - key: dhmain::inmain
  - key: mymod::dup
  - key: othermod::k
  - key: Upper::k
  - key: mymod
  - key: v3mod::k
  - key: unq2
  - id: basemod-modulepath
    key: basemod::k
    puppet_args: ["--modulepath", "./environments/production/modules"]
  - id: mymod-modulepath
    key: mymod::only_mod
    puppet_args: ["--modulepath", "./modules"]
  - key: h3bmod::k
    error_match: "'hiera3_backend' is only allowed in the global layer"
    error_class: ConfigError
  - id: v3mod-strict-error
    key: v3mod::k
    puppet_args: ["--strict", "error"]
    error_match: "cannot be used in a module"
    error_class: ConfigError
  - key: g_ref
  - key: g_alias
  - key: mymod::env_lo
  - key: mymod::modlo
  - key: badlo::k
    error_match: "all lookup_options keys must start with module name 'badlo'"
    error_class: HieraLookupError
  - key: badpat::k
    error_match: "all lookup_options patterns must match a key starting with module name 'badpat'"
    error_class: HieraLookupError
  - key: dhmain::indefault
  - id: dhmain::k-deep
    key: dhmain::k
    merge: deep
  - key: dhbad::k
    error_match: "all lookup_options keys must start with module name 'dhbad'"
    error_class: HieraLookupError
