description: >-
  Merge-option hash shapes lookup_options can declare: a bogus extra key, a
  strategy-less knockout, an unknown strategy name, an equivalent hash
  form, a plain string, an interpolated strategy, a non-dict legacy form,
  a first-with-a-hash-wrapper, a hash-strategy knockout, a null merge
  value, and an empty-string merge value.
queries:
  - key: m_bogus_opt
    error_match: "unrecognized key"
  - key: m_unique_ko
    error_match: "unrecognized key"
  - key: m_nostrat
  - key: m_unknown
    error_match: "Unknown merge strategy"
  - key: m_hashform
  - key: m_str
  - key: m_interp
  - key: m_notdict
  - key: m_first_hash
  - key: m_ko_hash
    error_match: "unrecognized key"
  - key: m_null
  - key: m_empty
    error_match: "Unknown merge strategy"
