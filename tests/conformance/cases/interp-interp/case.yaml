description: 'The interpolation engine''s full form catalogue (97 keys): var/topvar/fact
  references, whitespace, empty forms, quoting, indexing, falsy values, scope()/hiera()/lookup()/alias()/literal()
  functions, recursion, and nested key/array/hash interpolation.'
queries:
- key: lit_holder
- key: s_var
- key: s_topvar
- key: s_topfacts
- key: s_facts_nested
- key: s_facts_deep
- key: s_ws
- key: s_ws_topvar
- key: s_ws_func
- key: s_empty
- key: s_empty_colons
- key: s_empty_dq
- key: s_empty_sq
- key: s_empty_ws
- key: s_quoted_dq
- key: s_quoted_sq
- key: s_index
- key: s_index_neg
- key: s_index_oob
- key: s_str_walk
  error_class: HieraLookupError
  error_match: "Data Provider type mismatch: Got String when a hash-like object was expected"
- key: s_arr_key
  error_class: HieraLookupError
  error_match: "Data Provider type mismatch: Got Array when a hash-like object was expected"
- key: s_undef
- key: s_undef_nested
- key: s_int
- key: s_float
- key: s_bigfloat
- key: s_zero
- key: s_false
- key: s_true
- key: s_emptystr
- key: s_arr
- key: s_hash
  hash_inspect: true
- key: s_facts_false
- key: s_facts_zero
- key: s_whole_int
- key: s_whole_arr_scope
- key: s_whole_arr_var
- key: s_scope_fn
- key: s_scope_fn_dq
- key: s_scope_fn_false
- key: s_scope_fn_missing
- key: s_hiera_fn
- key: s_lookup_fn
- key: s_lookup_int
- key: s_lookup_int_emb
- key: s_lookup_bool_emb
- key: s_lookup_float_emb
- key: s_lookup_arr
- key: s_lookup_arr_emb
- key: s_lookup_hash_emb
  hash_inspect: true
- key: s_lookup_null_emb
- key: s_lookup_missing
- key: s_lookup_missing_whole
- key: s_lookup_dotted
- key: s_lookup_quoted
- key: s_lookup_colons
- key: s_lookup_lo
- key: s_lookup_strwalk
  error_class: HieraLookupError
  error_match: "from key 'base.x'"
- key: s_alias_str
- key: s_alias_arr
- key: s_alias_hash
- key: s_alias_int
- key: s_alias_bool
- key: s_alias_null
- key: s_alias_missing
- key: s_alias_embedded
  error_class: InterpolationError
  error_match: "'alias' interpolation is only permitted if the expression is equal to the entire string"
- key: s_alias_ws_inside
- key: s_alias_trailing_space
  error_class: InterpolationError
  error_match: "'alias' interpolation is only permitted if the expression is equal to the entire string"
- key: s_alias_two
  error_class: InterpolationError
  error_match: "'alias' interpolation is only permitted if the expression is equal to the entire string"
- key: s_alias_dotted
- key: s_literal
- key: s_literal_escape
- key: s_literal_dq
- key: s_literal_brace
- key: s_unknown_fn
  error_class: InterpolationError
  error_match: "Unknown interpolation method 'foo'"
- key: s_mixed_quotes
  error_class: HieraLookupError
  error_match: "Syntax error in string"
- key: s_fn_ws_args
  error_class: HieraLookupError
  error_match: "Syntax error in string"
- key: s_noquote_fn
- key: s_fn_empty_arg
  error_class: HieraLookupError
  error_match: "Syntax error in string"
- key: s_scope_tmpl
- key: s_scope_tmpl_top
- key: s_lookup_reinterp
- key: s_chain
- key: s_recursive_a
  error_class: InterpolationError
  error_match: 'Recursive lookup detected in \[s_recursive_a, s_recursive_b\]'
- key: s_recursive_b
  error_class: InterpolationError
  error_match: 'Recursive lookup detected in \[s_recursive_b, s_recursive_a\]'
- key: s_self
  error_class: InterpolationError
  error_match: 'Recursive lookup detected in \[s_self\]'
- key: s_alias_self
  error_class: InterpolationError
  error_match: 'Recursive lookup detected in \[s_alias_self\]'
- key: s_multi
- key: s_fn_then_var
- key: key_interp
- key: arr_interp
- key: alias_in_list
- key: alias_in_hash
- key: via_alias
- key: via_interp
- key: via_alias.k
- key: via_interp.inner
