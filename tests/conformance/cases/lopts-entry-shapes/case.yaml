description: >-
  lookup_options entry shapes: non-hash exact and pattern entries, Ruby
  regex-search matching vs Python fullmatch, the Ruby-only \h dialect and a
  lookbehind, the lookup_options key queried directly, and a found-null root
  key with a dotted dig.
queries:
  - key: karr
    error_class: HieraLookupError
  - key: kint
    error_class: HieraLookupError
  - key: kbool
    error_class: HieraLookupError
  - key: pn1
  - key: pa1
    error_class: HieraLookupError
  - key: hxbeef
  - key: lbkey
  - key: kneg
  - key: lookup_options
    divergence: spec-lookup-options-types/lookup-options-key-not-reserved
  - key: nk.a
    divergence:
      - code-core/null-value-treated-as-missing
      - code-core/dotted-key-root-semantics
  - key: ns.x
