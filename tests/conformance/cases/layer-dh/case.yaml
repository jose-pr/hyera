description: YAML-dialect edge cases (symbol keys, rich values, anchors, an unquoted
  vs. quoted dotted key) spread over two hierarchy levels, testing both the dialect
  divergences and level fallthrough/dotted navigation together.
queries:
- key: symkey
- key: :symkey
- key: symvalue
- key: nested
- key: nested.a
- key: nested.a.b
- key: onlysecond
- key: anchor_ref
- key: mergekey
- key: quoted.dot
