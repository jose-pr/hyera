description: >-
  An `eyaml_lookup_key` hierarchy entry, without the hiera-eyaml gem, fails
  to load the function -- it must not silently fall back to the defaults'
  `data_hash: yaml_data` and read the .eyaml file as plain YAML.
origin: spec-layers-backends/eyaml_level
queries:
  - key: k
    error_class: ConfigError
    error_match: 'eyaml_lookup_key'
    divergence: spec-layers-backends/lookup-key-level-read-as-data-hash
  - key: plain
    error_class: ConfigError
    error_match: 'eyaml_lookup_key'
    divergence: spec-layers-backends/lookup-key-level-read-as-data-hash
