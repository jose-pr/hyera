description: lookup_options with a dotted-fact pattern key and a dynamic merge strategy,
  alias() combined with lookup_options, and knockout/deep merges over interpolated
  values.
queries:
- key: lo_target
- key: lo_strat
- key: lo_aliased
- key: via_lo_alias
- key: via_lo_lookup
- key: first_interp
- key: nested_first
- key: m_alias
  id: m_alias_unique
  merge: unique
- key: ko_arr
  id: ko_arr_deep_ko
  merge:
    strategy: deep
    knockout_prefix: KO
- key: dm
  id: dm_deep
  merge: deep
- key: lo_ref
- key: lo_alias
- key: h_alias
  id: h_alias_hash
  merge: hash
- key: h_alias
  id: h_alias_deep
  merge: deep
