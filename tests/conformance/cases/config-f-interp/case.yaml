description: 'docs-accuracy: the README''s interpolation examples (lookup/hiera/alias/scope/literal,
  falsy facts, dotted facts, missing references).'
origin: docs-accuracy/f_interp
queries:
- key: lk_int
- key: lk_arr
- key: hiera_int
- key: alias_arr
- key: alias_int
- key: lk_missing
- key: sc_missing
- key: lit_escape
- key: spaces
- key: falsy_flag
- key: falsy_zero
- key: scope_flag
- key: unknown_fn
- key: empty_interp
- key: keyinterp
- key: nested_lookup
- key: dq_fn
- key: dotted_fact
- key: arr.x
- key: port.x
  deviation:
    id: integer-dotted-navigation-error-text
    reason: >-
      Navigating a dotted segment into an Integer crashes real Puppet with
      a raw Ruby NoMethodError ("undefined method 'include?' for an
      instance of Integer"), an interpreter accident rather than a
      designed message; hyera keeps its own "Data Provider type mismatch"
      text instead of reproducing the crash.
    expect:
      status: error
      message: "Data Provider type mismatch: Got Integer when a hash-like object was expected"
- key: arr.5
- key: lookup_options
- key: bare_missing
- key: fact_sub_missing
- key: fact_sub_missing2
