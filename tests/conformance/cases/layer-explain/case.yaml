description: >
  --explain across the global/environment/module layer stack: a module
  hierarchy entry, a module's default_hierarchy, a module with no
  hiera.yaml at all, and an unknown module -- plus --explain-options
  against the same module-scoped key.
origin: spec-layers-backends/layers
puppet_args:
  - --environment
  - production
queries:
  - key: mymod::arr
    explain: data
    ordered: true
    divergence: spec-layers-backends/explain-missing
  - key: mymod::dflt
    explain: data
    ordered: true
    divergence: spec-layers-backends/explain-missing
  - key: plain::k
    explain: data
    ordered: true
    divergence: spec-layers-backends/explain-missing
  - key: nomod::k
    explain: data
    ordered: true
    divergence: spec-layers-backends/explain-missing
  - key: mymod::arr
    id: mymod::arr-options
    explain: options
    ordered: true
    divergence: spec-layers-backends/explain-missing
