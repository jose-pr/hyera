    type: Integer[0]
    error_class: HieraLookupError
    error_match: "^\\s*Found\\ value\\ has\\ wrong\\ type,\\ expects\\ an\\ Integer\\[0\\]\\ value,\\ got\\ Integer\\[\\-3,\\ \\-3\\]"
