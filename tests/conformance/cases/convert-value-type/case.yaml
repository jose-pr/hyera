description: >-
  Every value/type pair the review probed for --type / value_type assertion:
  scalar and container instance checks, size-constrained types, Variant and
  Optional, Enum and Pattern, Struct and Tuple, and the named-only tier.
queries:
  - key: s
    id: t01
    type: String
  - key: s
    id: t02
    type: Integer
    error_class: HieraLookupError
    error_match: "^\\s*Found\\ value\\ has\\ wrong\\ type,\\ expects\\ an\\ Integer\\ value,\\ got\\ String"
  - key: n
    id: t03
    type: Integer
  - key: big
    id: t04
    type: Integer[0,10]
    error_class: HieraLookupError
    error_match: "^\\s*Found\\ value\\ has\\ wrong\\ type,\\ expects\\ an\\ Integer\\[0,\\ 10\\]\\ value,\\ got\\ Integer\\[11,\\ 11\\]"
  - key: big
    id: t05
    type: Integer[default,10]
    error_class: HieraLookupError
    error_match: "^\\s*Found\\ value\\ has\\ wrong\\ type,\\ expects\\ an\\ Integer\\[default,\\ 10\\]\\ value,\\ got\\ Integer\\[11,\\ 11\\]"
  - key: neg
