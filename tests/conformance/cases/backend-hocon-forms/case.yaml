description: 'HOCON forms: string concatenation with a substitution, a dotted-path
  key expanding into nested objects, a quoted key with a literal dot, a list, two
  same-named objects merged, and a duration literal.'
requires:
- pyhocon
queries:
- key: base
- key: derived
- key: a.b.c
- key: quoted.key
- key: list
- key: obj
  deviation:
    id: hocon-pyhocon-parser
    reason: >-
      pyhocon returns an object's keys in a different order from the
      Ruby HOCON gem when two same-named objects merge.
    expect:
      status: found
      value:
        k: v
        k2: v2
- key: dur
