description: 'HOCON values the parser must not hand back as its own objects or raw
  text: a quoted key holding "::" (a class parameter), a quoted key with a literal
  dot, a quoted key inside an object, null concatenated with text on either side,
  a lone null, and a backslash-u escape in a quoted string.'
requires:
- pyhocon
queries:
- key: ntp::servers
- key: quoted.dotted
- key: nested
- key: nullcat
- key: nullend
- key: nullalone
- key: escaped
