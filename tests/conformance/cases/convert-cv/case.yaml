description: >-
  Every convert_to target the review probed: Integer (plain/hex/octal/radix/
  bad/float/bool), Float, Boolean, String, Array, Hash, Numeric, Optional,
  Variant, an unparsable and an unknown type, a lowercase type name, a
  Sensitive wrap, SemVer, Timespan, Enum, Tuple, and a String format arg.
queries:
  - key: int_plain
  - key: int_hex
  - key: int_oct
  - key: int_bad
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'int_bad'\\ raised\\ error:\\ 'new'\\ The\\ string\\ 'abc'\\ cannot\\ be\\ converted\\ to\\ Integer"
  - key: int_float
  - key: int_radix
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'int_radix'\\ raised\\ error:\\ 'new'\\ The\\ string\\ 'ff'\\ cannot\\ be\\ converted\\ to\\ Integer"
  - key: int_bool
  - key: flt
  - key: flt_bad
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'flt_bad'\\ raised\\ error:\\ 'new_float'\\ The\\ string\\ 'x'\\ cannot\\ be\\ converted\\ to\\ Float"
  - key: bool_yes
  - key: bool_bad
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'bool_bad'\\ raised\\ error:\\ 'new_boolean'\\ The\\ string\\ 'maybe'\\ cannot\\ be\\ converted\\ to\\ Boolean"
  - key: bool_0
  - key: bool_str0
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'bool_str0'\\ raised\\ error:\\ 'new_boolean'\\ The\\ string\\ '0'\\ cannot\\ be\\ converted\\ to\\ Boolean"
  - key: str_bool
  - key: str_float
  - key: str_hash
  - key: str_arr
  - key: str_nil
  - key: arr_str
  - key: arr_hash
  - key: arr_wrap
  - key: arr_scalar
  - key: hash_arr
  - key: num
  - key: num_int
  - key: opt_int
  - key: var_int
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'var_int'\\ raised\\ error:\\ Creation\\ of\\ new\\ instance\\ of\\ type\\ 'Variant\\[Integer,\\ Float\\]'\\ is\\ not\\ supported"
  - key: badtype
    error_class: HieraLookupError
    error_match: "^\\s*Invalid\\ data\\ type\\ in\\ lookup_options\\ for\\ key\\ 'badtype'\\ could\\ not\\ parse\\ 'NoSuch\\[',\\ error:\\ 'Syntax\\ error\\ at\\ end\\ of\\ input"
  - key: unktype
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'unktype'\\ raised\\ error:\\ Creation\\ of\\ new\\ instance\\ of\\ type\\ 'TypeReference\\['Frobnicate'\\]'\\ is\\ not\\ supported"
  - key: sens
  - key: sens_arr
  - key: semver
    deviation:
      id: convert-to-unsupported-type
      reason: "hiera implements Puppet's new() only for types whose values are plain data; converting to SemVer, SemVerRange, Timespan, Timestamp, Regexp, Binary, URI, Type or Object raises."
      expect:
        status: error
        message: "The convert_to lookup_option for key 'semver' raised error: hiera does not support new() for the Puppet type 'SemVer'"
  - key: tspan
    deviation:
      id: convert-to-unsupported-type
      reason: "hiera implements Puppet's new() only for types whose values are plain data; converting to SemVer, SemVerRange, Timespan, Timestamp, Regexp, Binary, URI, Type or Object raises."
      expect:
        status: error
        message: "The convert_to lookup_option for key 'tspan' raised error: hiera does not support new() for the Puppet type 'Timespan'"
  - key: enum_t
  - key: lower_t
    error_class: HieraLookupError
    error_match: "^\\s*Invalid\\ data\\ type\\ in\\ lookup_options\\ for\\ key\\ 'lower_t'\\ could\\ not\\ parse\\ 'integer',\\ error:\\ 'The\\ expression\\ <integer>\\ is\\ not\\ a\\ valid\\ type\\ specification\\."
  - key: tuple_t
    error_class: HieraLookupError
    error_match: "wrong type"
  - key: str_fmt
  - key: int_plain
    id: int_plain-explicit-first
    merge: first
  - key: int_plain
    id: int_plain-explicit-unique
    merge: unique
    error_match: "cannot be converted to Integer"
