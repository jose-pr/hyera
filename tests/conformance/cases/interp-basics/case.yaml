description: >-
  Interpolation methods (scope/lookup/hiera/alias/literal) and their edge
  cases, recorded under the library's --strict warning default; one
  query opts into Puppet 8's --strict error to record the undefined-variable
  divergence directly.
origin: tests/conformance/cases/interpolation
queries:
  - key: greeting
  - key: ref_zero
  - key: topscope
  - key: fact_int
  - key: empty_interp
  - key: literal_pct
  - key: alias_list
  - key: ws
  - key: keyed
  - key: quoted
  - key: embed_missing
  - key: alias_missing
  - key: alone_list
  - key: rec
    error_class: InterpolationError
    error_match: 'Recursive lookup detected in \[rec\]'
  - key: unknown_fn
    error_class: InterpolationError
    error_match: "Unknown interpolation method 'foo'"
  - key: alias_embedded
    error_class: InterpolationError
    error_match: "'alias' interpolation is only permitted if the expression is equal to the entire string"
  - key: absent
  - key: absent
    id: absent-strict-error
    puppet_args: ["--strict", "error"]
    error_class: InterpolationError
    error_match: "Undefined variable 'absent'"
  - key: nope
  - key: h_interp
    hash_inspect: true
