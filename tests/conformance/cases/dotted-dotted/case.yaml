description: >-
  A dotted key digging past a scalar or into a list with a non-integer
  segment; the plain nested dig for comparison.
origin: standards-python/dotted
queries:
  - key: db.host.x
    id: dig-past-scalar
  - key: classes.foo
    id: list-nonint-segment
  - key: db.host
    id: nested-dig
