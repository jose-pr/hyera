description: >-
  Naming eyaml_lookup_key (a lookup_key-only function) as a data_dig entry
  is a Puppet config error at level build. Recorded with hiera-eyaml 5.0.1 present.
requires: [cryptography]
queries:
  - key: plain
    error_class: ConfigError
    error_match: "'eyaml_lookup_key' parameter 'key' expects a String value, got Tuple"
