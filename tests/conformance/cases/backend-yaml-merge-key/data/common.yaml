defaults: &defaults
  port: 80
  tls: false
other: &other
  port: 9000
  name: other
merge_after_key:
  port: 8443
  <<: *defaults
merge_before_key:
  <<: *defaults
  port: 8443
merge_list:
  <<: [*defaults, *other]
merge_twice:
  <<: *defaults
  <<: *other
quoted_key:
  '<<': *defaults
str_tagged_key:
  !!str <<: *defaults
null_value:
  <<: ~
  a: 1
scalar_value:
  <<: 5
  a: 1
list_with_scalar:
  <<: [*defaults, 5]
  a: 1
list_alias: &list [1, 2]
alias_to_list:
  <<: *list
  a: 1
