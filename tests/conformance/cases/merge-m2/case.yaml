description: >-
  A second merge matrix: unique/deep type mismatches across levels, sort_merged_arrays edge cases, a dotted knockout-prefix regex, a Ruby-regex-looking knockout prefix, and hash merge over two hashes.
queries:
  - key: "u_hash_lower"
    merge: unique
  - key: "u_two_hashes"
    merge: unique
  - key: "d_dup_lower"
    merge: deep
  - key: "d_top_dup_lower"
    merge: deep
  - key: "s_lower_only"
    merge: {strategy: deep, sort_merged_arrays: true}
  - key: "s_higher_only_nested"
    merge: {strategy: deep, sort_merged_arrays: true}
  - key: "s_bool"
    merge: {strategy: deep, sort_merged_arrays: true}
  - key: "ko_regex_prefix"
    merge: {strategy: deep, knockout_prefix: "."}
  - key: "ko_top_scalar"
    merge: {strategy: deep, knockout_prefix: "--"}
  - key: "ko_ruby_regex"
    merge: {strategy: deep, knockout_prefix: "x+"}
  - key: "h_both_arrays"
    merge: hash
