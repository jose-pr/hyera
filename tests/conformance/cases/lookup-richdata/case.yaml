description: Non-string YAML hash keys (boolean, null, nested, integer, float) are
  not valid Puppet lookup values; Puppet rejects the whole key's value, ours accepts
  and JSON-stringifies the odd key.
origin: critic-puppet-coverage/richdata
queries:
- key: k_boolkey
- key: k_nullkey
- key: k_nested
- key: k_intkey
- key: k_floatkey
- key: k_ok
