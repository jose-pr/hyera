description: >-
  A date-shaped fact in the --facts file is rejected, matching Puppet's
  own facts-file loading rules (no lenient mode for a YAML date).
origin: spec-context-facts/jsonfacts
queries:
  - key: v1
    id: v1
    error_class: BackendError
    error_match: "Tried to load unspecified class: Date"
    divergence: spec-context-facts/no-facts-loader-or-facter
