description: >
  puppet lookup --explain's own report: a hash merge with a nested
  strategy-per-key sub-merge, a missing hierarchy candidate, dotted
  sub-keys, alias/lookup interpolation, a miss (single and name-list),
  a default, and --explain-options against a lookup_options entry.
origin: spec-layers-backends/explain
queries:
  - key: greet
    explain: data
    ordered: true
  - key: h
    explain: data
    ordered: true
  - key: h.n.x
    explain: data
    ordered: true
  - key: arr
    explain: data
    ordered: true
  - key: arr
    id: arr-explicit-unique
    merge: unique
    explain: data
    ordered: true
  - key: h
    id: h-first
    merge: first
    explain: data
    ordered: true
  - key: nope
    explain: data
    ordered: true
  - key: nope
    id: nope-default
    default: dflt
    explain: data
    ordered: true
  - key: [nope, greet]
    explain: data
    ordered: true
  - key: num
    explain: data
    ordered: true
  - key: aliased
    explain: data
    ordered: true
  - key: looked
    explain: data
    ordered: true
  - key: lookup_options
    explain: data
    ordered: true
  - key: arr
    id: arr-options
    explain: options
    ordered: true
