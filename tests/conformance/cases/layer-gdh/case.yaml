description: >-
  A global hiera.yaml declaring default_hierarchy is a config error,
  swallowed by puppet lookup's normal miss path.
queries:
  - key: a
    error_match: "'default_hierarchy' is only allowed in the module layer"
    error_class: ConfigError
  - key: b
    error_match: "'default_hierarchy' is only allowed in the module layer"
    error_class: ConfigError
