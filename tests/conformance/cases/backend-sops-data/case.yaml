description: >-
  sops_data is a data_hash provider Puppet does not have (the one kept
  deviation). Puppet itself refuses the unknown function name; ours errors
  inside the sops subprocess step (no sops binary, or no key access to a
  plain, unencrypted file) -- both are "error" and both messages contain
  "sops".
origin: spec-layers-backends/alias_sops
queries:
  - key: k
    error_match: sops
    deviation:
      id: sops-backend
      reason: hyera keeps a sops data_hash backend that Puppet does not have
      expect:
        status: error
