---
v_env: "%{environment}"
v_facts_os_family: "%{facts.os.family}"
v_top_os_family: "%{os.family}"
v_topq_os_family: "%{::os.family}"
v_scope_fn: "%{scope('os.family')}"
v_scope_fn_q: "%{scope('::os.family')}"
v_facts_bool_false: "%{facts.is_virtual}"
v_top_bool_false: "%{is_virtual}"
v_top_bool_true: "%{flag_true}"
v_zero: "%{facts.processors.count}"
v_num: "%{num}"
v_float: "%{float}"
v_scope_num: "%{scope('num')}"
v_scope_bool: "%{scope('is_virtual')}"
v_scope_list: "%{scope('roles')}"
v_list_embed: "r=%{roles}"
v_hash_embed: "o=%{facts.os}"
v_trusted: "%{trusted}"
v_trusted_certname: "[%{trusted.certname}]"
v_server_facts: "%{server_facts}"
v_serverversion: "%{serverversion}"
v_clientcert: "%{clientcert}"
v_facts_clientcert: "%{facts.clientcert}"
