description: >-
  Dotted lookup-key sub-navigation: scalar/nil/list/hash segments, negative
  and out-of-range list indices, integer vs string hash keys, quoted key
  segments, and whitespace around dots. A single-quoted segment
  (`'a.b'.c`) is not harvested here: passing that token through
  `wsl.exe`'s own Win32->Linux argv translation corrupts it before Puppet
  ever runs (a tooling limitation of this harness, not a Puppet behavior --
  see `dotted-badkeys`); `double-quoted-segment` below covers the same
  quoted-segment grammar rule with a quote style the harness can deliver
  intact.
origin: code-io-security/subkeys
queries:
  - key: s.x
    id: scalar-segment
  - key: n.x
    id: nil-segment
  - key: n
    id: nil-value
    divergence: spec-lookup-options-types/found-nil-treated-as-missing
  - key: lst.x
    id: list-nonint-segment
  - key: lst.-1
    id: list-negative-index
  - key: lst.9
    id: list-out-of-range
  - key: h.0
    id: hash-int-key-as-string-segment
  - key: i.x
    id: int-scalar-segment
  - key: '"a.b".c'
    id: double-quoted-segment
  - key: a.b.c
    id: nested-dotted
  - key: "a . b . c"
    id: spaced-dots
