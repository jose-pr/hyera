description: >-
  Every convert_to new() conversion the review probed: Integer radix/
  whitespace/sign forms, Float/Numeric/Boolean lenient parsing, String
  formatting, Array/Hash iteration, parameterized and named types, and
  malformed convert_to shapes (a bare value, an empty/odd list, a hash).
queries:
  - key: i_oct8
  - key: i_bin2
  - key: i_hex16
  - key: i_badradix
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'i_badradix'\\ raised\\ error:\\ Illegal\\ radix:\\ 7,\\ expected\\ 2,\\ 8,\\ 10,\\ 16,\\ or\\ default"
  - key: i_ws
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'i_ws'\\ raised\\ error:\\ 'new'\\ The\\ string\\ '\\ 42\\ '\\ cannot\\ be\\ converted\\ to\\ Integer"
  - key: i_signws
  - key: i_neg
  - key: i_fstr
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'i_fstr'\\ raised\\ error:\\ 'new'\\ The\\ string\\ '3\\.7'\\ cannot\\ be\\ converted\\ to\\ Integer"
  - key: i_09
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'i_09'\\ raised\\ error:\\ invalid\\ value\\ for\\ Integer\\(\\):\\ \"09\""
  - key: i_arr
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'i_arr'\\ raised\\ error:\\ 'new'\\ Value\\ of\\ type\\ Array\\[Integer\\]\\ cannot\\ be\\ converted\\ to\\ Integer"
  - key: i_nil
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'i_nil'\\ raised\\ error:\\ 'new'\\ Value\\ of\\ type\\ Undef\\ cannot\\ be\\ converted\\ to\\ Integer"
  - key: i_range
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'i_range'\\ raised\\ error:\\ Converted\\ value\\ from\\ Integer\\[0,\\ 10\\]\\.new\\(\\)\\ has\\ wrong\\ type,\\ expects\\ an\\ Integer\\[0,\\ 10\\]\\ value,\\ got\\ Integer\\[42,\\ 42\\]"
  - key: i_already
  - key: q_int_bigneg
  - key: q_int_plus
  - key: q_int_octbad
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'q_int_octbad'\\ raised\\ error:\\ invalid\\ value\\ for\\ Integer\\(\\):\\ \"08\""
  - key: f_exp
  - key: f_bin
  - key: f_hex
  - key: f_int
  - key: f_bool
  - key: q_float_ws
  - key: n_hex
  - key: n_oct
  - key: n_bad
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'n_bad'\\ raised\\ error:\\ 'new_numeric'\\ The\\ string\\ '1\\.2\\.3'\\ cannot\\ be\\ converted\\ to\\ Numeric"
  - key: n_bool
  - key: q_num_space
  - key: b_Y
  - key: b_TRUE
  - key: b_float
  - key: b_str1
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'b_str1'\\ raised\\ error:\\ 'new_boolean'\\ The\\ string\\ '1'\\ cannot\\ be\\ converted\\ to\\ Boolean"
  - key: b_arr
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'b_arr'\\ raised\\ error:\\ 'new_boolean'\\ Value\\ of\\ type\\ Array\\[Boolean\\]\\ cannot\\ be\\ converted\\ to\\ Boolean"
  - key: s_pi
  - key: s_int
  - key: s_nested
  - key: s_strq
  - key: s_quote
  - key: s_arr_nested
  - key: s_nilarr
  - key: s_bool_arr
  - key: q_str_neg0
  - key: q_str_big
  - key: q_str_unicode
  - key: q_str_float_e
  - key: q_str_esc
  - key: s_fmt_d
  - key: s_fmt_p
  - key: s_fmt_bool
  - key: s_fmt_bad
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 's_fmt_bad'\\ raised\\ error:\\ Illegal\\ format\\ 'Q'\\ specified\\ for\\ value\\ of\\ Integer\\ type\\ \\-\\ expected\\ one\\ of\\ the\\ characters\\ 'dxXobBeEfgGaAspc'"
  - key: s_float_s
  - key: s_undef_fmt
  - key: a_float
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'a_float'\\ raised\\ error:\\ 'new_array'\\ Value\\ of\\ type\\ Float\\ cannot\\ be\\ converted\\ to\\ Array"
  - key: a_true
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'a_true'\\ raised\\ error:\\ 'new_array'\\ Value\\ of\\ type\\ Boolean\\ cannot\\ be\\ converted\\ to\\ Array"
  - key: a_nil
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'a_nil'\\ raised\\ error:\\ 'new_array'\\ Value\\ of\\ type\\ Undef\\ cannot\\ be\\ converted\\ to\\ Array"
  - key: a_zero
  - key: a_neg
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'a_neg'\\ raised\\ error:\\ 'new_array'\\ Value\\ of\\ type\\ Integer\\ cannot\\ be\\ converted\\ to\\ Array"
  - key: a_wrap_arr
  - key: a_false
  - key: arr_already
  - key: h_flat
  - key: h_odd
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'h_odd'\\ raised\\ error:\\ odd\\ number\\ of\\ arguments\\ for\\ Hash"
  - key: h_str
  - key: h_empty
  - key: h_int
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'h_int'\\ raised\\ error:\\ odd\\ number\\ of\\ arguments\\ for\\ Hash"
  - key: o_int
  - key: nu_int
  - key: se_str
  - key: se_int
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'se_int'\\ raised\\ error:\\ Converted\\ value\\ from\\ Sensitive\\[Integer\\]\\.new\\(\\)\\ has\\ wrong\\ type,\\ expects\\ a\\ Sensitive\\[Integer\\]\\ value,\\ got\\ Sensitive\\[String\\]"
  - key: q_sens_sens
  - key: en_bad
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'en_bad'\\ raised\\ error:\\ Creation\\ of\\ new\\ instance\\ of\\ type\\ 'Enum\\['a',\\ 'b'\\]'\\ is\\ not\\ supported"
  - key: tu_ok
  - key: st_hash
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'st_hash'\\ raised\\ error:\\ Converted\\ value\\ from\\ Struct\\[\\{'a'\\ =>\\ Integer\\}\\]\\.new\\(\\)\\ has\\ wrong\\ type,\\ entry\\ 'a'\\ expects\\ an\\ Integer\\ value,\\ got\\ String"
  - key: str_range
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'str_range'\\ raised\\ error:\\ Converted\\ value\\ from\\ String\\[1,\\ 2\\]\\.new\\(\\)\\ has\\ wrong\\ type,\\ expects\\ a\\ String\\[1,\\ 2\\]\\ value,\\ got\\ String"
  - key: ali_data
  - key: ali_std
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'ali_std'\\ raised\\ error:\\ Creation\\ of\\ new\\ instance\\ of\\ type\\ 'TypeReference\\['Stdlib::Port'\\]'\\ is\\ not\\ supported"
  - key: sc_t
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'sc_t'\\ raised\\ error:\\ Creation\\ of\\ new\\ instance\\ of\\ type\\ 'Scalar'\\ is\\ not\\ supported"
  - key: any_t
  - key: undef_t
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'undef_t'\\ raised\\ error:\\ Creation\\ of\\ new\\ instance\\ of\\ type\\ 'Undef'\\ is\\ not\\ supported"
  - key: bool_t
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'bool_t'\\ raised\\ error:\\ Converted\\ value\\ from\\ Boolean\\[true\\]\\.new\\(\\)\\ has\\ wrong\\ type,\\ expects\\ a\\ Boolean\\[true\\]\\ value,\\ got\\ Boolean\\[false\\]"
  - key: pat_t
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'pat_t'\\ raised\\ error:\\ Creation\\ of\\ new\\ instance\\ of\\ type\\ 'Pattern\\[/\\^x/\\]'\\ is\\ not\\ supported"
  - key: re_t
    deviation:
      id: convert-to-unsupported-type
      reason: "hyera implements Puppet's new() only for types whose values are plain data; converting to SemVer, SemVerRange, Timespan, Timestamp, Regexp, Binary, URI, Type or Object raises."
      expect:
        status: error
        message: "The convert_to lookup_option for key 're_t' raised error: hyera does not support new() for the Puppet type 'Regexp'"
  - key: q_int
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'q_int'\\ raised\\ error:\\ 'new'\\ parameter\\ 'type'\\ expects\\ a\\ Type\\ value,\\ got\\ Integer"
  - key: q_empty
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'q_empty'\\ raised\\ error:\\ 'new'\\ parameter\\ 'type'\\ expects\\ a\\ Type\\ value,\\ got\\ Undef"
  - key: q_hash
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'q_hash'\\ raised\\ error:\\ 'new'\\ parameter\\ 'type'\\ expects\\ a\\ Type\\ value,\\ got\\ Struct"
  - key: q_nil
  - key: q_estr
    error_class: HieraLookupError
    error_match: "^\\s*Invalid\\ data\\ type\\ in\\ lookup_options\\ for\\ key\\ 'q_estr'\\ could\\ not\\ parse\\ '',\\ error:\\ 'The\\ expression\\ <>\\ is\\ not\\ a\\ valid\\ type\\ specification\\."
  - key: q_extra
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'q_extra'\\ raised\\ error:\\ 'new'\\ expects\\ between\\ 1\\ and\\ 3\\ arguments,\\ got\\ 4"
  - key: q_boolarg
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'q_boolarg'\\ raised\\ error:\\ 'new_boolean'\\ expects\\ 1\\ argument,\\ got\\ 2"
  - key: q_arr_nested
    error_class: HieraLookupError
    error_match: "^\\s*The\\ convert_to\\ lookup_option\\ for\\ key\\ 'q_arr_nested'\\ raised\\ error:\\ 'new'\\ parameter\\ 'type'\\ expects\\ a\\ Type\\ value,\\ got\\ Tuple"
