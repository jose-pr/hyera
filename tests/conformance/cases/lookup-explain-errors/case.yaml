description: >
  Errors puppet lookup --explain reports as its own last text line
  (unknown interpolation method, an embedded alias, a top-level dig
  type mismatch) versus the two that escape the report instead (a real
  type mismatch reached through a sub-lookup, and a recursive lookup) --
  probed directly against Puppet 8.10, no known review finding.
queries:
  - key: unknown_fn
    explain: data
    ordered: true
    note: Puppet 8.10 probe
  - key: alias_emb
    explain: data
    ordered: true
    note: Puppet 8.10 probe
  - key: s.x
    explain: data
    ordered: true
    note: Puppet 8.10 probe
  - key: mismatch
    explain: data
    ordered: true
    error_match: "Data Provider type mismatch: Got String when a hash-like object was expected to access value using 'x' from key 's\\.x'"
    error_class: HieraLookupError
    note: Puppet 8.10 probe
  - key: self
    explain: data
    ordered: true
    error_match: "Recursive lookup detected in \\[self\\]"
    error_class: InterpolationError
    note: Puppet 8.10 probe
