description: >-
  Both hierarchy levels declare the exact same single-element array under
  a deep merge. Puppet deduplicates deep-merged arrays, so the result is
  one element, not two -- and because there is only one distinct value,
  the result is the same regardless of which level's copy "wins" the
  ordering question (a separate, already-marked divergence elsewhere),
  which makes this a non-divergent probe for a merge that stops
  deduplicating lists.
queries:
  - key: items
    merge: deep
