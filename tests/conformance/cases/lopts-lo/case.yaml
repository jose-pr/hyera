description: >-
  lookup_options resolution: regex patterns (anchored and named group),
  exact-key precedence, nil values under each merge strategy, a dotted
  literal key vs its root, and a lookup_options key that is itself queried.
origin: spec-lookup-options-types/lo
queries:
  - key: app::ports
  - key: a::b::list
  - key: s::t::x
  - key: exact_k
  - key: nilk
  - key: onlynil
  - key: nil_u
    id: nil_u-merge-unique
    merge: unique
  - key: nil_h
    id: nil_h-merge-hash
    merge: hash
  - key: nil_d
    id: nil_d-merge-deep
    merge: deep
  - key: db.port
  - key: db
  - key: dotcv.port
  - key: dotfirst.wanted
  - key: lookup_options
  - key: lookup_options.exact_k
  - key: rbkey
