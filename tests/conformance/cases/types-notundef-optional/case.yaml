    type: 'Optional[NotUndef]'
  - key: i1
    id: i1-optional-optional
    type: 'Optional[Optional]'
  - key: nil
    id: nil-optional-optional
    type: 'Optional[Optional]'
  - key: nil
    id: nil-notundef-notundef-integer
    type: 'NotUndef[NotUndef[Integer]]'
  - key: nil
    id: nil-notundef-optional-integer
    type: 'NotUndef[Optional[Integer]]'
  - key: s
