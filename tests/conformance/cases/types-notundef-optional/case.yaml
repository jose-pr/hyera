  - key: a1
    id: a1-variant-optional-integer-optional-string
    type: 'Variant[Optional[Integer], Optional[String]]'
  - key: s
    id: s-optional-any
    type: 'Optional[Any]'
  - key: nil
    id: nil-notundef-any
    type: 'NotUndef[Any]'
