  - key: s
    id: s-notundef-a
    type: 'NotUndef[''a'']'
  - key: nil
    id: nil-notundef-a
    type: 'NotUndef[''a'']'
  - key: nil
    id: nil-notundef-optional
    type: 'NotUndef[Optional]'
  - key: i1
