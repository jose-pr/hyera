description: >-
  The describer for NotUndef, Optional and Variant types: NotUndef[T] and
  Optional[T] reduce to T when T already decides undef, a bare Optional
  rejects every value it is given, and an Optional inside a Variant moves
  out to wrap it, merging string literals into one Enum.
queries:
  - key: i1
    id: i1-optional
    type: 'Optional'
  - key: s
    id: s-optional
    type: 'Optional'
  - key: nil
    id: nil-optional
    type: 'Optional'
  - key: i1
    id: i1-notundef
    type: 'NotUndef'
  - key: nil
    id: nil-notundef
    type: 'NotUndef'
  - key: s
    id: s-notundef
    type: 'NotUndef'
  - key: i1
    id: i1-notundef-integer
    type: 'NotUndef[Integer]'
  - key: nil
    id: nil-notundef-integer
    type: 'NotUndef[Integer]'
    error_class: HieraLookupError
    error_match: "^\\s*Found\\ value\\ has\\ wrong\\ type,\\ expects\\ an\\ Integer\\ value,\\ got\\ Undef"
  - key: s
    id: s-notundef-integer
    type: 'NotUndef[Integer]'
  - key: i1
    id: i1-variant-optional-integer
    type: 'Variant[Optional, Integer]'
  - key: nil
    id: nil-variant-optional-integer
    type: 'Variant[Optional, Integer]'
  - key: i1
    id: i1-variant-notundef-integer
    type: 'Variant[NotUndef, Integer]'
  - key: nil
    id: nil-variant-notundef-integer
    type: 'Variant[NotUndef, Integer]'
  - key: s
    id: s-variant-notundef-integer
    type: 'Variant[NotUndef, Integer]'
  - key: i1
    id: i1-array-optional
    type: 'Array[Optional]'
  - key: a1
    id: a1-array-optional
    type: 'Array[Optional]'
  - key: a1
    id: a1-array-notundef
    type: 'Array[NotUndef]'
  - key: h1
    id: h1-hash-string-optional
    type: 'Hash[String, Optional]'
  - key: h1
    id: h1-hash-string-notundef
    type: 'Hash[String, NotUndef]'
  - key: nil
    id: nil-variant-notundef-integer-notundef-float
    type: 'Variant[NotUndef[Integer], NotUndef[Float]]'
  - key: s
    id: s-variant-notundef-integer-notundef-float
    type: 'Variant[NotUndef[Integer], NotUndef[Float]]'
  - key: nil
    id: nil-variant-optional-a-optional-b
    type: 'Variant[Optional[''a''], Optional[''b'']]'
  - key: s
    id: s-variant-optional-a-optional-b
    type: 'Variant[Optional[''a''], Optional[''b'']]'
    error_class: HieraLookupError
    error_match: "^\\s*Found\\ value\\ has\\ wrong\\ type,\\ expects\\ an\\ undef\\ value\\ or\\ a\\ match\\ for\\ Enum\\['a',\\ 'b'\\],\\ got\\ 'str'"
  - key: s
    id: s-variant-optional-str-optional-b
    type: 'Variant[Optional[''str''], Optional[''b'']]'
  - key: i1
    id: i1-variant-optional-str-optional-b
    type: 'Variant[Optional[''str''], Optional[''b'']]'
  - key: nil
    id: nil-variant-optional-str-optional-b
    type: 'Variant[Optional[''str''], Optional[''b'']]'
  - key: s
    id: s-variant-optional-a-integer
    type: 'Variant[Optional[''a''], Integer]'
  - key: s
    id: s-optional-integer
    type: 'Optional[Integer]'
  - key: s
    id: s-optional-string
    type: 'Optional[String]'
  - key: s
