    error_match: "^\\s*Found\\ value\\ has\\ wrong\\ type,\\ expects\\ a\\ value\\ of\\ type\\ Undef,\\ Integer,\\ or\\ Enum\\['a',\\ 'b'\\],\\ got\\ String"
  - key: s
    id: s-variant-optional-a-enum-x
    type: 'Variant[Optional[''a''], Enum[''x'']]'
  - key: nil
    id: nil-variant-optional-integer-optional-string
