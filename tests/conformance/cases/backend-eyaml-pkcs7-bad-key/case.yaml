description: >-
  A malformed PKCS7 private key is loaded (and rejected) before the
  ciphertext is ever parsed: the configured key here is garbage, and the
  stored ciphertext is also garbage, but Puppet's own error names the key
  problem ("Neither PUB key nor PRIV key", the fixed text Ruby's OpenSSL
  binding raises), never "Could not parse the PKCS7".
  Recorded with hiera-eyaml 5.0.1 present.
requires: [cryptography]
queries:
  - key: corrupt
    error_class: BackendError
