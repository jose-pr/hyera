description: Whether lookup()/alias() calls inside a module's main hierarchy data
  can resolve a key that only exists in that module's own default_hierarchy, and vice
  versa.
puppet_args:
- --environment
- production
queries:
- key: mymod::only_main
- key: mymod::main_ref
- key: mymod::main_alias
- key: mymod::only_default
- key: mymod::dh_ref
- key: mymod::dh_alias
- key: mymod::dh_self
