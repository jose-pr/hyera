description: Whether lookup()/alias() calls inside a module's main hierarchy data
  can resolve a key that only exists in that module's own default_hierarchy, and vice
  versa.
origin: critic-puppet-coverage/subscope
puppet_args:
- --environment
- production
queries:
- key: mymod::only_main
- key: mymod::main_ref
  divergence: spec-layers-backends/default-hierarchy-semantics
- key: mymod::main_alias
  divergence: spec-layers-backends/default-hierarchy-semantics
- key: mymod::only_default
  divergence: spec-layers-backends/default-hierarchy-semantics
- key: mymod::dh_ref
  divergence: spec-layers-backends/default-hierarchy-semantics
- key: mymod::dh_alias
  divergence: spec-layers-backends/default-hierarchy-semantics
- key: mymod::dh_self
  divergence: spec-layers-backends/default-hierarchy-semantics
