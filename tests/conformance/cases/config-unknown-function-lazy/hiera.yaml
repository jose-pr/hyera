version: 5
defaults: {datadir: data, data_hash: yaml_data}
hierarchy:
  - {name: first, path: first.yaml}
  - {name: missing-location, data_hash: nosuch_fn, path: absent.yaml}
  - {name: no-glob-match, lookup_key: nosuch_fn, glob: "nothing-*.yaml"}
  - {name: empty-mapped, data_dig: nosuch_fn, mapped_paths: [no_such_list, x, "%{x}.yaml"]}
