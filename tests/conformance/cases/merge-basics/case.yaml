description: >-
  Merge strategies across a two-level hierarchy, driven both by explicit
  --merge flags and by lookup_options in the data.
queries:
  - key: vals
    merge: unique
  - key: db
    merge: hash
  - key: conf
    merge: deep
  - key: conf
    id: conf-ordered
    merge: deep
    ordered: true
  - key: oconf
    merge: deep
  - key: ko
    merge: {strategy: deep, knockout_prefix: "--"}
  - key: kosort
    merge: {strategy: deep, knockout_prefix: "--", sort_merged_arrays: true}
  - key: rows
    merge: {strategy: deep, merge_hash_arrays: true}
  - key: mixed
    merge: {strategy: deep, sort_merged_arrays: true}
  - key: classes
  - key: classes
    id: classes-first
    merge: first
  - key: items2
  - key: db.port
  - key: port
  - key: port
    id: port-explicit-first
    merge: first
  - key: secret
