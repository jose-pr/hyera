description: >-
  An unregistered `data_dig` function name is a Puppet config error naming
  the function kind and name.
queries:
  - key: k
    note: Puppet 8.10 probe
    error_class: ConfigError
    error_match: "Unable to find 'data_dig' function named 'nosuch_fn'"
    divergence: spec-layers-backends/lookup-key-level-read-as-data-hash
