description: Baseline interpolation probes over a small common.yaml/facts.yaml
  fixture -- literal/scope/hiera/lookup/alias functions, whitespace, recursion,
  hash keys and dotted sub-lookups into already-resolved values.
origin: code-core/interp
queries:
- key: plain
- key: s_false
- key: s_true
- key: s_zero
- key: s_nested_false
- key: s_list
  divergence: spec-interpolation/ruby-to_s-formatting
- key: s_hash
  hash_inspect: true
  divergence: spec-interpolation/ruby-to_s-formatting
- key: s_ws
- key: s_ws_fn
  divergence: spec-interpolation/whitespace-in-expression-ignored
- key: s_lit
  divergence: spec-interpolation/literal-escape-reinterpolated
- key: s_lit2
  divergence: spec-interpolation/literal-escape-reinterpolated
- key: s_hiera_missing
  divergence: spec-interpolation/missing-inline-lookup-raises
- key: s_alias_missing
  divergence: spec-interpolation/missing-inline-lookup-raises
- key: s_lookup_alone_int
  divergence: spec-interpolation/method-result-type-and-nonscalar
- key: s_lookup_alone_arr
  divergence: spec-interpolation/method-result-type-and-nonscalar
- key: s_lookup_alone_hsh
  hash_inspect: true
  divergence: spec-interpolation/method-result-type-and-nonscalar
- key: s_lookup_bool
- key: s_lookup_bool_alone
  divergence: spec-interpolation/method-result-type-and-nonscalar
- key: s_lookup_nil
  divergence: spec-interpolation/missing-inline-lookup-raises
- key: s_order
  divergence: spec-interpolation/scope-values-not-reinterpolated-and-garbled
- key: s_scope_reinterp
  divergence: spec-interpolation/scope-values-not-reinterpolated-and-garbled
- key: s_unknown_fn
  divergence: spec-interpolation/method-call-syntax-validation
- key: s_mismatch_quote
  divergence: spec-interpolation/method-call-syntax-validation
- key: s_empty
- key: s_colons
- key: s_scope_false
  divergence: spec-interpolation/method-result-type-and-nonscalar
- key: s_lit_colons
  divergence: spec-interpolation/method-call-syntax-validation
- key: s_float
- key: s_bigfloat
  divergence: spec-interpolation/ruby-to_s-formatting
- key: s_paren_var
  divergence: spec-interpolation/method-call-syntax-validation
- key: s_dq_fn
- key: s_neg_idx
- key: s_idx
- key: hkey
  divergence: spec-interpolation/hash-keys-not-interpolated
- key: cyc_a
  divergence: spec-interpolation/no-recursion-detection
- key: self_alias
  divergence: spec-interpolation/no-recursion-detection
- key: self_ref
  divergence: spec-interpolation/no-recursion-detection
- key: nilv
  divergence: code-core/null-value-treated-as-missing
- key: lookup_options
- key: arr.-1
- key: plain.x
- key: arr.x
- key: nilv.x
- key: int.x
