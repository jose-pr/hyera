description: Baseline interpolation probes over a small common.yaml/facts.yaml
  fixture -- literal/scope/hiera/lookup/alias functions, whitespace, recursion,
  hash keys and dotted sub-lookups into already-resolved values.
origin: code-core/interp
queries:
- key: plain
- key: s_false
- key: s_true
- key: s_zero
- key: s_nested_false
- key: s_list
- key: s_hash
  hash_inspect: true
- key: s_ws
- key: s_ws_fn
- key: s_lit
- key: s_lit2
- key: s_hiera_missing
- key: s_alias_missing
- key: s_lookup_alone_int
- key: s_lookup_alone_arr
- key: s_lookup_alone_hsh
  hash_inspect: true
- key: s_lookup_bool
- key: s_lookup_bool_alone
- key: s_lookup_nil
- key: s_order
- key: s_scope_reinterp
- key: s_unknown_fn
  error_class: InterpolationError
  error_match: "Unknown interpolation method 'foo'"
- key: s_mismatch_quote
  error_class: HieraLookupError
  error_match: "Syntax error in string"
- key: s_empty
- key: s_colons
- key: s_scope_false
- key: s_lit_colons
- key: s_float
- key: s_bigfloat
- key: s_paren_var
- key: s_dq_fn
- key: s_neg_idx
- key: s_idx
- key: hkey
- key: cyc_a
  divergence: spec-interpolation/no-recursion-detection
- key: self_alias
  divergence: spec-interpolation/no-recursion-detection
- key: self_ref
  divergence: spec-interpolation/no-recursion-detection
- key: nilv
  divergence: code-core/null-value-treated-as-missing
- key: lookup_options
- key: arr.-1
- key: plain.x
  error_class: HieraLookupError
  error_match: "Data Provider type mismatch: Got String when a hash-like object was expected"
- key: arr.x
  error_class: HieraLookupError
  error_match: "Data Provider type mismatch: Got Array when a hash-like object was expected"
- key: nilv.x
- key: int.x

  error_class: HieraLookupError