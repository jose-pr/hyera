description: lookup_options across levels (unique/deep/hash merges, bad merge names,
  a typo'd knockout option key), a null shadowing a lower level, and dotted navigation
  into a String/Array/null leaf.
origin: code-core/levels
queries:
- key: nil_first
  divergence: code-core/null-value-treated-as-missing
- key: db.port
  divergence: code-core/dotted-key-root-semantics
- key: db.host
- key: unique_single
  id: unique_single_u
  merge: unique
- key: unique_single_arr
  id: unique_single_arr_u
  merge: unique
- key: deep_arr
  id: deep_arr_deep
  merge: deep
- key: hash_nonhash
  id: hash_nonhash_hash
  merge: hash
- key: hash_single_str
  id: hash_single_str_hash
  merge: hash
- key: unique_nested
  id: unique_nested_u
  merge: unique
- key: unique_hash
  id: unique_hash_u
  merge: unique
- key: k_alias
  id: k_alias_hash
  merge: hash
- key: pfx::x
  divergence: code-core/dotted-key-root-semantics
- key: lo_root.a
  divergence: code-core/dotted-key-root-semantics
- key: conv
- key: conv
  id: conv_first
  merge: first
  divergence: spec-lookup-options-types/explicit-merge-drops-convert-to
- key: badmerge
- key: typo_opt
- key: mha
  id: mha_deep_hasharr
  merge:
    strategy: deep
    merge_hash_arrays: true
- key: str_leaf.x
- key: list_leaf.x
- key: null_leaf.x
