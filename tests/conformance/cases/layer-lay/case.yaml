description: >-
  The layer stack with an OS-selected environment level, a module
  pruning warning on an unqualified key, and module default_hierarchy
  arrays/hashes merged against the caller's merge.
queries:
  - key: top
  - key: envkey
  - key: envos
  - key: mm::onlymod
  - key: mm::envmod
  - key: unq
  - key: mm::darr
  - key: mm::dopt
  - key: mm::h
  - id: mm::h-deep
    key: mm::h
    merge: deep
  - key: mm::arr
  - id: mm::darr-unique
    key: mm::darr
    merge: unique
