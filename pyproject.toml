[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license fields need 1.27
build-backend = "hatchling.build"

[project]
name = "hyera"
dynamic = ["version"]
authors = [{ name = "jose-pr" }]
description = "A Python implementation of Puppet Hiera hierarchical data lookup"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND Apache-2.0 AND BSD-2-Clause"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
keywords = ["hiera", "puppet", "config", "hierarchy", "yaml", "lookup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0,<7",
    # Path type only; glob levels use hyera's own Dir.glob port, so no glob
    # keyword or patch floor is needed.
    "pathlib_next>=0.9.0,<0.10",
]

[project.optional-dependencies]
cli = ["duho>=0.6.0,<0.7"]
# 0.3.29 is the first pyhocon that does not pin pyparsing 2.0.3-2.1.1, which
# fails to import on Python 3.10 and later; 0.3.29-0.3.61 still call
# pyparsing's deprecated setDefaultWhitespaceChars, which fails the suite
# under this project's filterwarnings=error. 0.3.62 is the first release
# using the non-deprecated set_default_whitespace_chars. Separately, 0.3.60
# is the first release with config_parser.get_period_expr, which
# HOCONBackend replaces (in a private module copy) to keep durations as
# text instead of datetime.timedelta -- already covered by the 0.3.62 floor
# above, so this comment records the reason, not a higher number.
hocon = ["pyhocon>=0.3.62,<0.4"]
# Composes every feature extra that has tests, so ranges live only in those
# extras -- without pyhocon/duho the HOCON/CLI tests silently skip instead of
# running. `hatchling` is left out: build isolation supplies it.
dev = ["hyera[cli,hocon]", "black", "build", "pytest", "twine"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
hyera = "hyera.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/hyera/"
Documentation = "https://jose-pr.github.io/hyera/"
Issues = "https://github.com/jose-pr/hyera/issues"

# hatchling reads __version__ from the file itself, without importing the
# package or consulting installed metadata -- a stale editable install can't
# mislead it, and there is only one copy of the version to keep in sync.
[tool.hatch.version]
path = "src/hyera/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hyera"]
# *.local.* -- unshared per-machine notes (see the sdist exclude below).
# CLAUDE*/.claude -- agent tooling config, never a shipped artifact.
exclude = ["*.local.*", "CLAUDE*", ".claude"]


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/hyera/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "hyera/README.md"

# /.* -- category rule: nothing dot-prefixed at the repo root ships (mirrors
# .gitignore's rule); an `AGENTS.local.md` beside the shipping `AGENTS.md`
# has no leading dot and would otherwise be packaged, so *.local.* is listed
# separately. /AGENTS.md -- the repo-root contributor doc does not ship (only
# src/hyera/AGENTS.md, the API header, does). CLAUDE*/.claude -- agent
# tooling config never ships.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "*.local.*", "CLAUDE*", ".claude"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

# Pinned to the project's minimum supported Python so black never emits
# syntax the floor cannot parse.
[tool.black]
target-version = ["py39"]

[tool.pyright]
reportPrivateImportUsage = false
