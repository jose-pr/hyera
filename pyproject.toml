[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyera"
version = "0.1.0"
authors = [{ name = "jose-pr" }]
description = "A Python implementation of Puppet Hiera hierarchical data lookup"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
keywords = ["hiera", "puppet", "config", "hierarchy", "yaml", "lookup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["pyyaml", "pathlib_next>=0.9.0,<0.10"]

[project.optional-dependencies]
cli = ["duho>=0.6.0,<0.7"]
hocon = ["pyhocon"]
# Includes every extra that has tests depending on it -- without pyhocon the
# HOCON backend tests silently skip instead of running.
dev = ["build", "twine", "hatchling", "pytest", "duho>=0.6.0,<0.7", "pyhocon", "black"]

[project.scripts]
pyera = "pyera.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/pyera/"
Issues = "https://github.com/jose-pr/pyera/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyera"]
# Unshared per-machine notes never ship (see the sdist exclude below).
exclude = ["*.local.*"]


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/pyera/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pyera/README.md"

# `/.*` only covers dot-prefixed roots; an `AGENTS.local.md` beside the
# shipping `AGENTS.md` has no leading dot and would otherwise be packaged.
# Unshared `*.local.*` files never leave the checkout.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "*.local.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

# Pinned to the project's minimum supported Python so black never emits
# syntax the floor cannot parse.
[tool.black]
target-version = ["py39"]

[tool.pyright]
reportPrivateImportUsage = false
