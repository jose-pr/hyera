name: Test

# On-demand test workflow, kept separate from release.yml's own release-gate
# test job so it can be run without cutting a release. Two ways to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so a run can
#     be triggered and polled via the API/CLI without dashboard access.
# Not triggered by push/PR on branches by default. The benchmark job runs only
# on a dispatch with `benchmark` set, or on a "ci-bench-*" tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
      benchmark:
        description: "Also run the benchmark job (never a gate)"
        type: boolean
        default: false
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu: every supported version.
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows/macOS: the supported edges only.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        # Every extra that has tests depending on it, or those tests skip
        # instead of running: cli -> duho (test_cli.py), hocon -> pyhocon
        # (test_backends.py), eyaml -> cryptography (test_eyaml.py,
        # test_providers.py).
        run: python -m pip install -e ".[dev,cli,hocon,eyaml]"
      - name: Run tests
        # -rs so any skip is visible in the log: a green run with the
        # backend tests skipped is not a verified run.
        run: python -m pytest -q -rs

  # Type-completeness gate: every symbol hyera exports has a known type and a
  # docstring (pyright --verifytypes).
  types:
    name: Types (pyright, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev tooling
        run: python -m pip install -e ".[dev]"
      - name: Print pyright version
        run: python -m pyright --version
      - name: Check type completeness
        run: |
          python -m pyright --pythonpath "$(which python)" --verifytypes hyera --ignoreexternal > verifytypes.txt || { cat verifytypes.txt; exit 1; }
          cat verifytypes.txt
          grep -q "Functions without docstring: 0" verifytypes.txt
          grep -q "Classes without docstring: 0" verifytypes.txt

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`),
  # on the oldest supported Python. The matrix above only ever gets the newest
  # releases, so a floor that no longer works would otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev,cli,hocon,eyaml]"
      - name: Run tests
        run: python -m pytest -q -rs

  # Branch coverage, reported for reading -- not a gate (PYTHON.md does not
  # ask for one by default; the mutation run is this project's acceptance
  # evidence instead). continue-on-error so a coverage-tool break never
  # blocks the rest of the run.
  coverage:
    name: Coverage report (not a gate)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package with all extras
        run: python -m pip install -e ".[dev,cli,hocon,eyaml]"
      - name: Run tests under coverage
        run: python -m coverage run --branch --source=src/hyera -m pytest -q -rs
      - name: Show missing lines/branches
        run: python -m coverage report --show-missing
      - name: Write the summary table
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  format:
    name: Format (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install black
        # The major `dev` pins: two majors format differently, and the newest
        # interpreter is the one the check runs on.
        run: python -m pip install "black>=26,<27"
      - name: Check formatting
        run: python -m black --check src/ tests/ benchmarks/ examples/

  # The same strict build the release gates on (release.yml's docs-gate), run
  # on every ci-* tag so a docstring or docs change that breaks the site
  # shows up here first, not on a release.
  docs:
    name: Docs build (strict, no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs,cli,hocon]"
      - name: Build docs
        run: mkdocs build --strict

  # Every job above runs an editable install; this one runs the script pip
  # actually writes from a built wheel, in a clean venv, on each OS - the
  # only way to catch a case where the command works in an editable install
  # but not from the wheel pip ships. The command is `hyera` everywhere and
  # installs nothing named `hiera`, so it coexists with Puppet's own
  # /usr/bin/hiera (the standalone Hiera 3.12 gem).
  console-script:
    name: Console script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir wheelhouse
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then
            scripts="$(cygpath -u "$RUNNER_TEMP")/smoke/Scripts"
          else
            scripts="$RUNNER_TEMP/smoke/bin"
          fi
          "$scripts/python" -m pip install -q "$(ls wheelhouse/*.whl)[cli]"
      - name: Run the installed script
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            scripts="$(cygpath -u "$RUNNER_TEMP")/smoke/Scripts"
          else
            scripts="$RUNNER_TEMP/smoke/bin"
          fi
          cd "$RUNNER_TEMP"
          PATH="$scripts:$PATH" hyera --version
          PATH="$scripts:$PATH" python -m hyera --version
          if ls "$scripts" | grep -i hiera; then
            echo "unexpected hiera script" >&2
            exit 1
          fi

  # Release benchmarks: benchmarks/run.py on Ubuntu, both interpreter bounds,
  # both revalidate modes, uploaded as one artifact per interpreter. Never a
  # gate: nothing here compares or asserts, and no other job needs it.
  benchmark:
    name: Benchmark (py${{ matrix.python-version }})
    if: ${{ inputs.benchmark || startsWith(github.ref, 'refs/tags/ci-bench-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with the command-line extra
        run: python -m pip install -e ".[cli]"
      - name: Run the benchmarks
        run: |
          mkdir -p bench-results
          python benchmarks/run.py --save --results-dir bench-results
          python benchmarks/run.py --revalidate off --save --results-dir bench-results
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks-py${{ matrix.python-version }}
          path: bench-results/*.json
          if-no-files-found: error
