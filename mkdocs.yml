site_name: pyera
site_description: A Python implementation of Puppet Hiera hierarchical data lookup
site_url: https://jose-pr.github.io/pyera/
repo_url: https://github.com/jose-pr/pyera
repo_name: jose-pr/pyera
edit_uri: edit/main/docs/

# Constrain the scan to docs/ so pymdownx.snippets + strict nav don't trip on
# repo-level markdown (see kb/PYTHON.md Known Difficulties).
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - API Reference:
      - pyera: api/pyera.md
      - pyera.backends: api/backends.md
      - pyera.cli: api/cli.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            heading_level: 1
            docstring_style: sphinx
            show_if_no_docstring: true
            filters: ["!^_[^_]", "!^__all__$"]

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
